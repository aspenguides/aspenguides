# Site configuration. Keep this small; content lives in content/.
baseURL = 'https://example.github.io/aspenguides/'   # set to the real URL once the repo / domain exists
locale = 'en-US'
title = 'Aspen Suites Guest Guide'

[params]
  description = 'Where to eat, what to do and how things work around Aspen Suites.'
  # Address shown in the footer and used for "directions" links.
  address = 'Aspen Suites'
  # Shown in the footer under the header photo (static/images/pirin-lakes.jpg).
  photoCredit = 'Header photo: <a href="https://commons.wikimedia.org/wiki/File:Pirin_-_Gergiyski_ezera_-_IMG_4439.jpg">Gergiyski lakes, Pirin</a> by Dido3, <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>, cropped and resized.'

# Section order and labels for the top navigation.
[[menus.main]]
  name = 'Eat & Drink'
  pageRef = '/eat'
  weight = 10
[[menus.main]]
  name = 'Things to do'
  pageRef = '/do'
  weight = 20
[[menus.main]]
  name = 'Amenities'
  pageRef = '/amenities'
  weight = 30
[[menus.main]]
  name = 'Essentials'
  pageRef = '/essentials'
  weight = 40

[markup.goldmark.renderer]
  unsafe = true   # allow raw HTML (e.g. embedded maps) inside markdown

[taxonomies]
  tag = 'tags'
